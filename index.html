<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div id="upperContainer">
                <h1 id="title"> Generate a <br> <span>random password</span> </h1>
                <p id="subTitle"> Never use an insecure password again.</p>
                <p id="textSelect"> (Select a number between 5 and 15)</p>
                <div id="input">
                    <input id="inputNum" placeholder="Select" type="number" min="5" max="15">
                    <button id="btn">Generate passwords</button>
                </div>
            </div>
            <div id="lowerContainer">
                <div id="firstPassword"></div>
                <div id="secondPassword"></div>
            </div>
        </div>


        <script src="index.js"></script>
    </body>
</html>
